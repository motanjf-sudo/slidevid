<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SlideVid · اسلاید به ویدیو</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f1117; --surface: #1a1d27; --surface2: #222636;
  --border: #2e3248; --accent: #6c63ff; --accent-light: #8b85ff;
  --text: #e8e9f0; --muted: #8b8fa8; --success: #4caf88;
  --error: #e05c5c; --radius: 12px;
}
body { font-family: 'Vazirmatn', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
header { display: flex; align-items: center; gap: 12px; padding: 20px 32px; border-bottom: 1px solid var(--border); }
.logo { font-size: 20px; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--accent-light)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.tagline { font-size: 13px; color: var(--muted); background: var(--surface); padding: 3px 10px; border-radius: 20px; border: 1px solid var(--border); }
main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
.step { display: none; flex-direction: column; align-items: center; text-align: center; width: 100%; max-width: 700px; gap: 24px; }
.step.active { display: flex; }
h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
.sub { color: var(--muted); font-size: 15px; line-height: 1.6; }
.upload-area { width: 100%; border: 2px dashed var(--border); border-radius: var(--radius); padding: 48px 24px; cursor: pointer; transition: all 0.2s; background: var(--surface); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.upload-area:hover { border-color: var(--accent); background: rgba(108,99,255,0.06); }
.upload-area.has-file { border-style: solid; border-color: var(--success); background: rgba(76,175,136,0.06); }
.upload-icon { font-size: 40px; }
.upload-area p { font-size: 15px; font-weight: 500; }
.upload-hint { font-size: 12px; color: var(--muted); }
.settings { width: 100%; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.setting-group { display: flex; flex-direction: column; gap: 6px; text-align: right; }
.setting-group label { font-size: 12px; color: var(--muted); font-weight: 500; }
select { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 8px 12px; font-family: 'Vazirmatn', sans-serif; font-size: 13px; cursor: pointer; }
.btn-primary { background: var(--accent); color: #fff; border: none; border-radius: var(--radius); padding: 14px 40px; font-family: 'Vazirmatn', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; width: 100%; }
.btn-primary:hover:not(:disabled) { background: var(--accent-light); }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-secondary { background: transparent; color: var(--muted); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 32px; font-family: 'Vazirmatn', sans-serif; font-size: 14px; cursor: pointer; width: 100%; margin-top: 8px; }
.slides-grid { width: 100%; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.slide-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; position: relative; }
.slide-card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; }
.slide-card .slide-status { position: absolute; bottom: 0; left: 0; right: 0; padding: 6px 8px; font-size: 11px; font-weight: 500; text-align: center; }
.slide-card.waiting .slide-status { background: rgba(0,0,0,0.6); color: var(--muted); }
.slide-card.processing .slide-status { background: rgba(108,99,255,0.8); color: #fff; }
.slide-card.done .slide-status { background: rgba(76,175,136,0.8); color: #fff; }
.slide-card.error .slide-status { background: rgba(224,92,92,0.8); color: #fff; }
.slide-number { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.6); color: #fff; font-size: 11px; padding: 2px 6px; border-radius: 4px; }
.overall-progress { width: 100%; display: flex; flex-direction: column; gap: 8px; }
.progress-label { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.progress-bar { width: 100%; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-light)); border-radius: 3px; transition: width 0.4s ease; width: 0%; }
.done-icon { font-size: 56px; }

/* پرزنتیشن */
.presentation { width: 100%; background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; }
.slide-viewer { position: relative; }
.slide-viewer img { width: 100%; display: block; }
.slide-caption { padding: 16px 20px; font-size: 14px; line-height: 1.8; color: var(--text); text-align: right; border-top: 1px solid var(--border); max-height: 150px; overflow-y: auto; }
.slide-controls { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; border-top: 1px solid var(--border); gap: 12px; }
.slide-nav { display: flex; gap: 8px; }
.nav-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-family: 'Vazirmatn', sans-serif; font-size: 13px; }
.nav-btn:hover:not(:disabled) { border-color: var(--accent); }
.nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.slide-counter { font-size: 13px; color: var(--muted); }
.play-btn { background: var(--accent); border: none; color: #fff; padding: 8px 20px; border-radius: 8px; cursor: pointer; font-family: 'Vazirmatn', sans-serif; font-size: 13px; font-weight: 600; }
.play-btn:hover { background: var(--accent-light); }

.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--error); color: #fff; padding: 12px 20px; border-radius: var(--radius); display: flex; align-items: center; gap: 12px; font-size: 14px; z-index: 999; }
.toast.hidden { display: none; }
.toast button { background: none; border: none; color: #fff; cursor: pointer; font-size: 16px; }
@media (max-width: 480px) { .settings { grid-template-columns: 1fr; } h1 { font-size: 22px; } }
</style>
</head>
<body>
<header>
  <span class="logo">SlideVid</span>
  <span class="tagline">اسلاید → پرزنتیشن صوتی</span>
</header>
<main>
  <section id="step-upload" class="step active">
    <h1>فایل PowerPoint خود را آپلود کنید</h1>
    <p class="sub">هر اسلاید با صدای AI توضیح داده می‌شود</p>
    <div class="upload-area" id="uploadArea">
      <div class="upload-icon">📂</div>
      <p id="uploadText">فایل PPTX را اینجا بکشید یا کلیک کنید</p>
      <span class="upload-hint" id="uploadHint">فقط فرمت .pptx پشتیبانی می‌شود</span>
    </div>
    <input type="file" id="fileInput" accept=".pptx" style="display:none" />
    <div class="settings">
      <div class="setting-group">
        <label>زبان صدا</label>
        <select id="language">
          <option value="fa">فارسی</option>
          <option value="en">انگلیسی</option>
        </select>
      </div>
      <div class="setting-group">
        <label>سبک توضیح</label>
        <select id="style">
          <option value="professional">رسمی</option>
          <option value="friendly">دوستانه</option>
          <option value="educational">آموزشی</option>
        </select>
      </div>
    </div>
    <button class="btn-primary" id="startBtn" disabled>شروع پردازش</button>
  </section>

  <section id="step-processing" class="step">
    <h1>در حال پردازش...</h1>
    <div class="slides-grid" id="slidesGrid"></div>
    <div class="overall-progress">
      <div class="progress-label">
        <span id="progressText">آماده‌سازی...</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>
  </section>

  <section id="step-done" class="step">
    <div class="done-icon">✅</div>
    <h1>پرزنتیشن آماده است!</h1>
    <p class="sub" id="slideInfo"></p>
    <div class="presentation">
      <div class="slide-viewer">
        <img id="slideImage" src="" alt="اسلاید" />
      </div>
      <div class="slide-caption" id="slideCaption"></div>
      <div class="slide-controls">
        <div class="slide-nav">
          <button class="nav-btn" id="prevBtn">→ قبلی</button>
          <button class="nav-btn" id="nextBtn">بعدی ←</button>
        </div>
        <span class="slide-counter" id="slideCounter">۱ / ۱</span>
        <button class="play-btn" id="playBtn">▶ پخش صدا</button>
      </div>
    </div>
    <button class="btn-secondary" id="restartBtn">پردازش فایل جدید</button>
  </section>
</main>

<div id="errorToast" class="toast hidden">
  <span id="errorMsg"></span>
  <button onclick="document.getElementById('errorToast').classList.add('hidden')">✕</button>
</div>

<script type="module">
import { convertPptxToPng, initResvgWasm } from 'https://esm.sh/pptx-glimpse@latest';

const WORKER_URL = 'https://slidevid-api.motanjf.workers.dev';

const uploadArea = document.getElementById('uploadArea');
const fileInput = document.getElementById('fileInput');
const startBtn = document.getElementById('startBtn');
const slidesGrid = document.getElementById('slidesGrid');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');
const progressPct = document.getElementById('progressPercent');
const slideImage = document.getElementById('slideImage');
const slideCaption = document.getElementById('slideCaption');
const slideCounter = document.getElementById('slideCounter');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const playBtn = document.getElementById('playBtn');
const slideInfo = document.getElementById('slideInfo');
const restartBtn = document.getElementById('restartBtn');

let selectedFile = null;
let allSlides = []; // [{png, script, audioUrl}]
let currentIndex = 0;
let currentAudio = null;

uploadArea.addEventListener('click', () => fileInput.click());
uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.style.borderColor = 'var(--accent)'; });
uploadArea.addEventListener('dragleave', () => { uploadArea.style.borderColor = ''; });
uploadArea.addEventListener('drop', e => { e.preventDefault(); uploadArea.style.borderColor = ''; if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', () => { if (fileInput.files[0]) handleFile(fileInput.files[0]); });

function handleFile(file) {
  if (!file.name.toLowerCase().endsWith('.pptx')) { showError('فقط فایل .pptx پشتیبانی می‌شود'); return; }
  selectedFile = file;
  uploadArea.classList.add('has-file');
  document.getElementById('uploadText').textContent = '✓ ' + file.name;
  document.getElementById('uploadHint').textContent = (file.size/1024/1024).toFixed(1) + ' MB';
  startBtn.disabled = false;
}

startBtn.addEventListener('click', async () => {
  if (!selectedFile) return;
  const language = document.getElementById('language').value;
  const style = document.getElementById('style').value;
  const duration = parseInt(document.getElementById('duration').value);

  showStep('step-processing');
  setProgress(0, 'خواندن فایل PPTX...');

  try {
    // تبدیل PPTX به PNG
    setProgress(5, 'تبدیل اسلایدها به تصویر...');
    const pptxBuffer = await selectedFile.arrayBuffer();
    const { convertPptxToPng: cvt, initResvgWasm: init } = await import('https://esm.sh/pptx-glimpse@latest');
    const wasmRes = await fetch('https://unpkg.com/@resvg/resvg-wasm@2.6.2/index_bg.wasm');
    await init(wasmRes);
    const { slides } = await cvt(new Uint8Array(pptxBuffer));
    if (!slides?.length) throw new Error('اسلایدی پیدا نشد');

    renderSlideCards(slides);
    setProgress(15, slides.length + ' اسلاید پیدا شد');
    allSlides = slides.map(s => ({ png: s.png, script: '', audioUrl: '' }));

    // پردازش هر اسلاید
    for (let i = 0; i < slides.length; i++) {
      updateSlideCard(i, 'processing', 'پردازش...');
      setProgress(20 + Math.round((i / slides.length) * 75), 'اسلاید ' + (i+1) + ' از ' + slides.length);

      const base64 = btoa(String.fromCharCode(...slides[i].png));
      const res = await fetch(WORKER_URL + '/generate', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ slideIndex: i, imageBase64: base64, language, style, duration })
      });

      if (!res.ok) { const e = await res.json(); throw new Error(e.error || 'خطا'); }

      const audioBlob = new Blob([await res.arrayBuffer()], {type: 'audio/wav'});
      allSlides[i].audioUrl = URL.createObjectURL(audioBlob);

      // گرفتن متن هم
      const res2 = await fetch(WORKER_URL + '/script', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ slideIndex: i, imageBase64: base64, language, style, duration })
      });
      if (res2.ok) { const d = await res2.json(); allSlides[i].script = d.script || ''; }

      updateSlideCard(i, 'done', '✓ آماده');
    }

    setProgress(100, 'تمام شد!');
    slideInfo.textContent = slides.length + ' اسلاید آماده است';
    currentIndex = 0;
    showSlide(0);
    showStep('step-done');

  } catch (err) {
    console.error(err);
    showError(err.message || 'خطایی رخ داد');
    showStep('step-upload');
  }
});

function showSlide(i) {
  if (!allSlides[i]) return;
  currentIndex = i;
  const slide = allSlides[i];
  const imgUrl = URL.createObjectURL(new Blob([slide.png], {type: 'image/png'}));
  slideImage.src = imgUrl;
  slideCaption.textContent = slide.script || '';
  slideCounter.textContent = (i+1) + ' / ' + allSlides.length;
  prevBtn.disabled = i === 0;
  nextBtn.disabled = i === allSlides.length - 1;
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  playBtn.textContent = '▶ پخش صدا';
}

prevBtn.addEventListener('click', () => showSlide(currentIndex - 1));
nextBtn.addEventListener('click', () => showSlide(currentIndex + 1));

playBtn.addEventListener('click', () => {
  const slide = allSlides[currentIndex];
  if (!slide?.audioUrl) return;
  if (currentAudio && !currentAudio.paused) {
    currentAudio.pause();
    playBtn.textContent = '▶ پخش صدا';
    return;
  }
  currentAudio = new Audio(slide.audioUrl);
  currentAudio.play();
  playBtn.textContent = '⏸ توقف';
  currentAudio.onended = () => { playBtn.textContent = '▶ پخش صدا'; };
});

restartBtn.addEventListener('click', () => {
  selectedFile = null; allSlides = []; currentIndex = 0;
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  fileInput.value = '';
  uploadArea.classList.remove('has-file');
  document.getElementById('uploadText').textContent = 'فایل PPTX را اینجا بکشید یا کلیک کنید';
  document.getElementById('uploadHint').textContent = 'فقط فرمت .pptx پشتیبانی می‌شود';
  startBtn.disabled = true;
  slidesGrid.innerHTML = '';
  showStep('step-upload');
});

function renderSlideCards(slides) {
  slidesGrid.innerHTML = '';
  slides.forEach((slide, i) => {
    const url = URL.createObjectURL(new Blob([slide.png], {type: 'image/png'}));
    const card = document.createElement('div');
    card.className = 'slide-card waiting';
    card.id = 'card-' + i;
    card.innerHTML = '<img src="' + url + '" /><div class="slide-number">' + (i+1) + '</div><div class="slide-status">در انتظار</div>';
    slidesGrid.appendChild(card);
  });
}

function updateSlideCard(i, status, text) {
  const card = document.getElementById('card-' + i);
  if (!card) return;
  card.className = 'slide-card ' + status;
  card.querySelector('.slide-status').textContent = text;
}

function showStep(id) { document.querySelectorAll('.step').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
function setProgress(pct, text) { progressFill.style.width = pct + '%'; progressText.textContent = text; progressPct.textContent = pct + '%'; }
function showError(msg) { document.getElementById('errorMsg').textContent = msg; document.getElementById('errorToast').classList.remove('hidden'); }
</script>
</body>
</html>
